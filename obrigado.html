<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obrigado! | Qualitas Jr.</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Inter:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .thanks-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #ffffff 0%, #f4f7f9 100%);
        }
        .thanks-icon {
            font-size: 4rem;
            color: #27ae60; /* Verde para sucesso */
            margin-bottom: 20px;
        }
        .thanks-container h1 { font-size: 2.5rem; margin-bottom: 15px; }
        .thanks-container p { font-size: 1.2rem; color: #555; max-width: 600px; margin-bottom: 30px; }
        .btn-back {
            background-color: var(--azul-principal);
            color: rgb(0, 0, 0);
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
        }
    </style>
</head>
<body>
    <div class="thanks-container">
        <div class="thanks-icon"><i class="fas fa-check-circle"></i></div>
        <h1>Solicitação Recebida!</h1>
        <p>Obrigado por confiar na <strong>Qualitas Jr.</strong> Nossa equipe analisará seus dados e a Presidente Vitória Risso entrará em contato em breve para agendarmos seu diagnóstico gratuito.</p>
        <a href="index.html" class="btn-back">Voltar para o site</a>
    </div>
</body>
</html>
